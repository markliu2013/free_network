proxy-providers:

  Airport1:
    url: "https://profile.honeyvora.com/assets/app/profile/6d435a3472576f624a3461454b4d4558/manifest?channel=stable&v=v1"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  Airport2:
    url: "https://sub3.smallstrawberry.com/api/v1/client/subscribe?token=17e73181f16cd30a053840fb5796fd92"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  Airport3:
    url: "https://8.218.167.131:55356/api/v1/client/subscribe?token=1aa6f83577c8789304709f04ce0e265e-1"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连


# ==============================
# 基础节点
# ==============================
proxies:
  - {name: 直连, type: direct, udp: true}


# ==============================
# 全局配置
# ==============================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894

allow-lan: true
mode: Rule

external-controller: 127.0.0.1:9090
secret: "请设置自己的控制器密码"

bind-address: "*"

ipv6: false
unified-delay: true
tcp-concurrent: true

# interface-name: enp6s18

log-level: info
find-process-mode: 'off'
global-client-fingerprint: chrome

keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true


# ==============================
# TUN
# ==============================
tun:
  enable: true
  stack: mixed

  dns-hijack:
    - any:53
    - tcp://any:53

  # 使用 Nikki 时按客户端实际要求配置
  # device: nikki

  auto-route: false
  auto-redirect: false
  auto-detect-interface: false


# ==============================
# DNS
# ==============================
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false

  respect-rules: true

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist

  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"

  default-nameserver:
    - 223.5.5.5

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

  nameserver:
    - 223.5.5.5
    - 119.29.29.29


# ==============================
# 出站策略
# ==============================
proxy-groups:

  # ----------------------------
  # 默认代理
  # ----------------------------
  - name: 🚀 默认代理
    type: select
    proxies:
      - 🔄 机场优先级
      - ♻️ 所有-自动
      - ♻️ 香港-自动
      - ♻️ 美国-自动
      - 🔯️ 所有-故转
      - 🌐 所有-选择
      - 直连


  # ----------------------------
  # AI 服务
  # ----------------------------
  - name: 🤖 ChatGPT
    type: select
    proxies:
      - 🔄 机场优先级
      - ♻️ 所有-自动
      - ♻️ 香港-自动
      - ♻️ 美国-自动
      - 🔯️ 所有-故转
      - 🌐 所有-选择
      - 直连


  # ----------------------------
  # 漏网之鱼
  # ----------------------------
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🔄 机场优先级
      - ♻️ 所有-自动
      - ♻️ 香港-自动
      - ♻️ 美国-自动
      - 🔯️ 所有-故转
      - 🌐 所有-选择
      - 直连


  # ============================================================
  # 机场1内部自动测速
  # ============================================================
  - name: 🥇 机场1
    type: url-test
    use:
      - Airport1
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 60
    lazy: true


  # ============================================================
  # 机场2内部自动测速
  # ============================================================
  - name: 🥈 机场2
    type: url-test
    use:
      - Airport2
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 60
    lazy: true


  # ============================================================
  # 机场3内部自动测速
  # ============================================================
  - name: 🥉 机场3
    type: url-test
    use:
      - Airport3
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 60
    lazy: true


  # ============================================================
  # 机场优先级
  # 机场1 -> 机场2 -> 机场3 -> 直连
  # ============================================================
  - name: 🔄 机场优先级
    type: fallback
    proxies:
      - 🥇 机场1
      - 🥈 机场2
      - 🥉 机场3
      - 直连
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true


  # ============================================================
  # 所有节点自动测速
  # ============================================================
  - name: ♻️ 所有-自动
    type: url-test
    include-all: true
    tolerance: 60
    interval: 150
    filter: "^(?!直连$).*"
    lazy: true


  # ============================================================
  # 香港节点自动测速
  # ============================================================
  - name: ♻️ 香港-自动
    type: url-test
    include-all: true
    tolerance: 60
    interval: 150
    filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$"
    lazy: true


  # ============================================================
  # 美国节点自动测速
  # ============================================================
  - name: ♻️ 美国-自动
    type: url-test
    include-all: true
    tolerance: 60
    interval: 150
    filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$"
    lazy: true


  # ============================================================
  # 全节点故障切换
  # ============================================================
  - name: 🔯️ 所有-故转
    type: fallback
    include-all: true
    filter: "^(?!直连$).*"
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: true


  # ============================================================
  # 所有节点手动选择
  # ============================================================
  - name: 🌐 所有-选择
    type: select
    include-all: true
    filter: "^(?!直连$).*"


# ==============================
# 规则匹配
# ==============================
rules:

  # 私有地址直连
  - RULE-SET,private_ip,直连
  - RULE-SET,private_domain,直连

  # 国内流量直连
  - RULE-SET,cn_domain,直连
  - RULE-SET,cn_ip,直连

  # AI 服务
  - RULE-SET,ai,🤖 ChatGPT

  # 代理规则
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,geolocation-!cn,🚀 默认代理

  # 其他流量
  - MATCH,🐟 漏网之鱼


# ==============================
# 规则集锚点
# ==============================
rule-anchor:

  ip: &ip
    type: http
    interval: 86400
    behavior: ipcidr
    format: mrs

  domain: &domain
    type: http
    interval: 86400
    behavior: domain
    format: mrs

  class: &class
    type: http
    interval: 86400
    behavior: classical
    format: text


# ==============================
# 规则集
# ==============================
rule-providers:

  private_domain:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs

  proxylite:
    <<: *class
    url: https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/proxy.list

  ai:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs

  geolocation-!cn:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs

  cn_domain:
    <<: *domain
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs

  private_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs

  cn_ip:
    <<: *ip
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs
